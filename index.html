<title>Actas CUSAFA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Transcripción colaborativa de reuniones y redacción de actas. Sin almacenamiento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500&display=swap">
<style>
/* Layout: banda institucional azul SAFA arriba; debajo, sala de trabajo en tres zonas (panel / transcripción / herramientas) que se apilan en móvil. */
:root{
  --band:#006A9D; --brand:#006A9D; --brand-deep:#004E75; --brand-ink:#0C2C40; --brand-soft:#E3EFF6; --brand-tint:#F2F7FA;
  --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#EEF3F6; --line:#D4DFE6; --line-strong:#B4C6D2;
  --fg:#13232F; --muted:#557083; --on-brand:#FFFFFF;
  --rec:#C8372D; --rec-soft:#FBE7E5; --ok:#1E7A4C; --ok-soft:#E2F2E9; --warn:#A8670A; --warn-soft:#FBF0DC;
  --f-ui:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-doc:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"Fira Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(12,44,64,.06),0 4px 16px rgba(12,44,64,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#0D4462; --brand:#3A9BCF; --brand-deep:#0D4462; --brand-ink:#CFE6F3; --brand-soft:#123449; --brand-tint:#0F2533;
  --bg:#0A1822; --surface:#10222F; --surface-2:#152B3A; --line:#22394A; --line-strong:#2F4C61;
  --fg:#E4EEF4; --muted:#8FA9BB; --on-brand:#FFFFFF;
  --rec:#F0675C; --rec-soft:#3A1D1C; --ok:#5BC08C; --ok-soft:#12301F; --warn:#E3A53F; --warn-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --band:#0D4462; --brand:#3A9BCF; --brand-deep:#0D4462; --brand-ink:#CFE6F3; --brand-soft:#123449; --brand-tint:#0F2533;
  --bg:#0A1822; --surface:#10222F; --surface-2:#152B3A; --line:#22394A; --line-strong:#2F4C61;
  --fg:#E4EEF4; --muted:#8FA9BB; --on-brand:#FFFFFF;
  --rec:#F0675C; --rec-soft:#3A1D1C; --ok:#5BC08C; --ok-soft:#12301F; --warn:#E3A53F; --warn-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* banda institucional */
.band{background:var(--band);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;min-height:60px}
.band img{height:44px;width:auto;display:block}
.band .app{display:flex;flex-direction:column;line-height:1.15;padding-left:16px;border-left:1px solid rgba(255,255,255,.35)}
.band .app b{font-weight:600;font-size:16px;letter-spacing:.01em}
.band .app span{font-size:12px;opacity:.82;letter-spacing:.04em;text-transform:uppercase}
.band .sp{flex:1}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border:1px solid rgba(255,255,255,.4);border-radius:99px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.lock svg{width:13px;height:13px}

/* tipografía */
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-family:var(--f-doc);font-weight:500;font-size:clamp(28px,4.4vw,42px);line-height:1.12}
h2{font-size:19px}
h3{font-size:15px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);background:var(--brand-tint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:15.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--fg);font-size:14.5px}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--brand);flex:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.rec{background:var(--rec-soft);color:var(--rec)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.dot.live{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:var(--r);font-size:13.5px;color:var(--fg)}
.notice.info{border-left-color:var(--brand);background:var(--brand-tint)}
.notice.ok{border-left-color:var(--ok);background:var(--ok-soft)}

/* inicio */
.home{padding-block:44px 64px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:880px){.home-grid{grid-template-columns:1fr;gap:28px}}
.lead{font-size:17px;color:var(--muted);max-width:56ch;margin-top:14px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.action{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.action:hover{border-color:var(--brand);transform:translateY(-1px)}
.action.main{background:var(--brand);border-color:var(--brand);color:#fff}
.action.main .muted{color:rgba(255,255,255,.82)}
.action b{font-size:16px;font-weight:600}
.action svg{width:22px;height:22px;margin-bottom:4px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:36px;border-top:1px solid var(--line)}
@media (max-width:640px){.flow{grid-template-columns:1fr 1fr}}
.flow div{padding:14px 14px 0 0}
.flow .n{font-family:var(--f-mono);font-size:12px;color:var(--brand)}
.flow b{display:block;font-size:14px;margin:2px 0}
.flow p{font-size:13px;color:var(--muted)}
.guar{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:12px}
.guar li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px}
.guar svg{width:18px;height:18px;color:var(--ok);margin-top:2px}
.guar li.w svg{color:var(--warn)}

/* formulario */
.form-page{padding-block:32px 64px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.form-grid{grid-template-columns:1fr}}
.agenda-edit{display:flex;flex-direction:column;gap:8px}
.agenda-edit .ai{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center}
.agenda-edit .num{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}

/* sala */
.room-head{background:var(--surface);border-bottom:1px solid var(--line)}
.room-head .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.room-head h2{font-family:var(--f-doc);font-weight:500;font-size:21px;min-width:0}
.clock{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.room{display:grid;grid-template-columns:280px minmax(0,1fr) 390px;gap:16px;padding-block:16px 120px;align-items:start}
@media (max-width:1180px){.room{grid-template-columns:270px minmax(0,1fr)}.room .tools{grid-column:1/-1}}
@media (max-width:760px){.room{grid-template-columns:1fr;padding-bottom:190px}.room .tx{order:-1}.tx-body{max-height:62vh;min-height:280px}.dock .btn{padding:7px 10px;font-size:13px}.recbtn{padding:9px 16px;font-size:14px}.lock span{display:none}.band .app span{display:none}.u{grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px}.u .t{grid-column:1/-1;padding:0}.u.sys{grid-template-columns:1fr}.interim{padding-left:14px}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
.qr{background:#fff;padding:8px;border-radius:6px;border:1px solid var(--line);width:172px;height:172px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:var(--f-mono);font-size:26px;letter-spacing:.18em;font-weight:500;color:var(--brand)}
.plist{list-style:none;margin:0;padding:6px 0}
.plist li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 14px}
.plist li+li{border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
.pname{font-size:14px;font-weight:500;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.pmeta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meter{width:46px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .12s}
.agenda-list{list-style:none;margin:0;padding:6px 0;counter-reset:a}
.agenda-list li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 14px;font-size:14px;cursor:pointer;border-left:3px solid transparent}
.agenda-list li .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.agenda-list li.cur{background:var(--brand-tint);border-left-color:var(--brand);font-weight:500}
.agenda-list li.done{color:var(--muted)}
.hands{display:flex;flex-direction:column;gap:6px;padding:10px 14px}
.hand{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}

.tx{min-width:0}
.tx-tools{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tx-tools input{max-width:240px;padding:6px 10px;font-size:13.5px}
.tx-body{padding:6px 0 18px;max-height:calc(100vh - 260px);min-height:360px;overflow-y:auto}
.tx-item-h{position:sticky;top:0;background:var(--surface);z-index:1;padding:14px 20px 8px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
.tx-item-h .n{font-family:var(--f-mono);font-size:12.5px;color:var(--brand)}
.tx-item-h b{font-family:var(--f-doc);font-weight:600;font-size:16.5px}
.u{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:10px 20px;align-items:start}
.u:hover{background:var(--brand-tint)}
.u .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.u .who{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.u .who .sw{width:9px;height:9px;border-radius:2px}
.u .txt{font-family:var(--f-doc);font-size:16px;line-height:1.55;margin-top:2px;overflow-wrap:anywhere}
.u .txt[contenteditable=true]{outline:1px dashed var(--brand);outline-offset:3px;border-radius:2px;background:var(--surface)}
.u .ops{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.u:hover .ops,.u:focus-within .ops{opacity:1}
@media (hover:none){.u .ops{opacity:1}}
.u .ops button{border:0;background:transparent;padding:5px;border-radius:4px;cursor:pointer;color:var(--muted)}
.u .ops button:hover{background:var(--surface-2);color:var(--brand)}
.u .ops svg{width:15px;height:15px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.tag.acuerdo{background:var(--ok-soft);color:var(--ok)}
.tag.tarea{background:var(--warn-soft);color:var(--warn)}
.tag.merged{background:var(--surface-2);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.u.sys{grid-template-columns:62px 1fr}
.u.sys .txt{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);font-style:italic}
.u.note .txt{font-family:var(--f-ui);font-size:14.5px}
.u.vote .box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2);margin-top:4px}
.interim{padding:6px 20px 6px 94px;font-family:var(--f-doc);font-style:italic;color:var(--muted);font-size:15px}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--line-strong);margin-bottom:8px}

.tools{min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tabp{padding:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,110px) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px}
.bar .v{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.ag-list{display:flex;flex-direction:column;gap:8px}
.ag{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.ai-out{font-family:var(--f-doc);font-size:15px;line-height:1.6;min-height:260px;max-height:520px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--surface)}

/* barra de control */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(12,44,64,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;gap:10px;align-items:center;padding-block:12px;flex-wrap:wrap}
.dock .sp{flex:1}
.recbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:99px;border:0;font-weight:600;font-size:15px;cursor:pointer;background:var(--rec);color:#fff}
.recbtn.paused{background:var(--brand)}
.recbtn .dot{background:#fff}

/* participante */
.pp{max-width:560px;margin:0 auto;padding-block:28px 60px}
.mic-hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 20px;text-align:center}
.mic-ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);position:relative;transition:background .2s}
.mic-ring svg{width:48px;height:48px;color:var(--muted)}
.mic-ring.on{background:var(--rec-soft)}
.mic-ring.on svg{color:var(--rec)}
.mic-ring .halo{position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--rec);opacity:0;transition:opacity .1s,transform .1s}
.mine{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.mine div{font-family:var(--f-doc);font-size:15px;padding:8px 12px;background:var(--surface-2);border-radius:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,24,36,.55);display:grid;place-items:center;padding:16px}
.modal .card{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.priv h4{margin:16px 0 6px;font-size:14px}
.priv p,.priv li{font-size:14px;color:var(--fg)}
.priv ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* proyección */
.proj{position:fixed;inset:0;z-index:60;background:#006A9D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.proj .qr{width:min(48vh,80vw);height:min(48vh,80vw);padding:14px}
.proj .code{color:#fff;font-size:clamp(34px,6vw,64px)}
.proj img{height:64px}

/* votación: panel de la secretaría */
.vpanel{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:96px;width:min(400px,calc(100% - 32px));max-height:calc(100vh - 200px);overflow:auto;box-shadow:var(--shadow);border-top:4px solid var(--brand)}
.vpanel .vp-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.vp-s{font-family:var(--f-doc);font-weight:500;font-size:20px;line-height:1.25}
.vprog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.vprog .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.vprog .tr i{display:block;height:100%;background:var(--brand);transition:width .3s}
.vwho{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.vwho li{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vwho li.done{color:var(--fg)} .vwho li.wait{color:var(--muted)}
.vmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vmini button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 4px;font-size:13px;font-weight:500;cursor:pointer}
.vmini button[aria-pressed=true].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.vmini button[aria-pressed=true].no{background:var(--rec);border-color:var(--rec);color:#fff}
.vmini button[aria-pressed=true].abs{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.vres{display:flex;flex-direction:column;gap:10px}
.vres-h{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.vres-h.ok{color:var(--ok)} .vres-h.ko{color:var(--rec)} .vres-h.tie{color:var(--warn)}
.vbar{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.vbar .tr{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.vbar .tr i{display:block;height:100%;border-radius:4px;transition:width .5s ease-out}
.vbar .tr i.yes{background:var(--ok)} .vbar .tr i.no{background:var(--rec)} .vbar .tr i.abs{background:var(--muted)}
.vbar .n{font-family:var(--f-mono);font-size:14px;text-align:right;font-weight:500}
.vdetail{font-size:13px;color:var(--muted);line-height:1.5}
.vdetail b{color:var(--fg);font-weight:500}
.vcard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcard label{display:flex;flex-direction:column;gap:4px;padding:12px;border:1.5px solid var(--line-strong);border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.vcard label b{font-size:14.5px;color:var(--fg)}
.vcard input{position:absolute;opacity:0;pointer-events:none}
.vcard label:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
@media (max-width:520px){.vcard{grid-template-columns:1fr}}

/* votación: pantalla del asistente */
.vov{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:vrise .25s ease-out}
.vov::before{content:"";position:fixed;top:0;left:0;right:0;height:6px;background:var(--band)}
@keyframes vrise{from{transform:translateY(14px)}to{transform:none}}
.vov-in{max-width:520px;margin:0 auto;padding-block:30px 40px;display:flex;flex-direction:column;gap:20px}
.vov-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vov-q{font-family:var(--f-doc);font-weight:500;font-size:clamp(25px,6.4vw,32px);line-height:1.18;text-wrap:balance}
.vopts{display:flex;flex-direction:column;gap:12px}
.vopt{display:grid;grid-template-columns:58px minmax(0,1fr) 26px;align-items:center;gap:16px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.vopt:active{transform:scale(.985)}
.vopt .ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:background .15s,color .15s}
.vopt .ic svg{width:28px;height:28px}
.vopt b{display:block;font-size:20px;font-weight:600;line-height:1.2}
.vopt span.d{font-size:13px;color:var(--muted)}
.vopt .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:#fff}
.vopt .tick svg{width:16px;height:16px;opacity:0}
.vopt.yes .ic{background:var(--ok-soft);color:var(--ok)}
.vopt.no .ic{background:var(--rec-soft);color:var(--rec)}
.vopt.abs .ic{background:var(--surface-2);color:var(--muted)}
.vopt.yes[aria-pressed=true]{border-color:var(--ok);background:var(--ok-soft)}
.vopt.no[aria-pressed=true]{border-color:var(--rec);background:var(--rec-soft)}
.vopt.abs[aria-pressed=true]{border-color:var(--muted);background:var(--surface-2)}
.vopt.yes[aria-pressed=true] .ic,.vopt.yes[aria-pressed=true] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.vopt.no[aria-pressed=true] .ic,.vopt.no[aria-pressed=true] .tick{background:var(--rec);border-color:var(--rec);color:#fff}
.vopt.abs[aria-pressed=true] .ic,.vopt.abs[aria-pressed=true] .tick{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.vopt[aria-pressed=true] .tick svg{opacity:1}
.vopts.voted .vopt[aria-pressed=false]{opacity:.62}
.vsent{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--brand-tint);border:1px solid var(--line);font-size:14px}
.vsent svg{width:20px;height:20px;color:var(--ok);flex:none}
.vpriv{display:flex;gap:10px;font-size:13px;color:var(--muted);line-height:1.45}
.vpriv svg{width:18px;height:18px;flex:none;margin-top:1px}
/* pulsar para hablar y ajuste del micrófono */
.ptt{width:100%;max-width:340px;min-height:64px;padding:16px 20px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:18px;font-weight:600;cursor:pointer;display:flex;gap:12px;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s}
.ptt:active{transform:scale(.98)}
.ptt.on{background:var(--rec)}
.ptt svg{width:24px;height:24px}
.calbox{display:flex;flex-direction:column;gap:12px}
.calbox .say{font-family:var(--f-doc);font-size:19px;line-height:1.4;padding:12px 14px;border-left:3px solid var(--brand);background:var(--brand-tint);border-radius:4px}
.calbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.calbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .1s}
.tag.doubt{background:var(--warn-soft);color:var(--warn);border:0;cursor:pointer;font-family:inherit}
.tag.pol{background:var(--brand-soft);color:var(--brand);text-transform:none;letter-spacing:0;font-weight:500}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg3 button{padding:9px 6px;line-height:1.25}
.seg.sm button{padding:5px 10px;font-size:12.5px}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--brand-ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.foot{padding-block:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
</style>

function modal(title, bodyHTML, buttons = [{label:"Cerrar", cls:"", act:null}]) {
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true");

/* -------------------- Micrófono + reconocimiento -------------------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function pct(arr, q) { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(q * (a.length - 1)))]; }

/* Micrófono. Mide el volumen 20 veces por segundo (en decibelios) para saber con qué
   intensidad oyó cada frase, comparado con la voz de su propio usuario. */
class Mic {
  constructor({onFinal, onInterim, onLevel, onState, onActivity, local}) { Object.assign(this, {onFinal, onInterim, onLevel, onState, onActivity, local}); this.on = false; this.frames = []; this.uStart = null; this.cal = null; this.phrases = []; }
  async open() {
    if (!window.isSecureContext) throw new Error("insecure");
    if (!SR) throw new Error("nosr");
    this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:false}});
    this.track = this.stream.getAudioTracks()[0] || null;
    const AC = window.AudioContext || window.webkitAudioContext; this.ac = new AC(); try { await this.ac.resume(); } catch {}
    const src = this.ac.createMediaStreamSource(this.stream); this.an = this.ac.createAnalyser(); this.an.fftSize = 1024; src.connect(this.an);
    const buf = new Float32Array(this.an.fftSize);
    this.iv = setInterval(() => {
      if (!this.an) return;
      this.an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v*v; const rms = Math.sqrt(s/buf.length);
      const db = 20 * Math.log10(rms + 1e-9); this.frames.push([Date.now(), db]); if (this.frames.length > 900) this.frames.splice(0, this.frames.length - 900);
      this.onLevel && this.onLevel(Math.min(1, rms*7), this.rel(db));
    }, 50);
  }
  noiseFloor() { return pct(this.frames.slice(-400).map(f => f[1]), 0.1) ?? -70; }
  /* Intensidad relativa: 0 ≈ la voz de su usuario; muy negativa ≈ voz lejana. */
  rel(db) { if (db < -100) return null; return this.cal ? db - this.cal.voice : (db - this.noiseFloor()) - 28; }
  score(t0, t1) {
    const fs = this.frames.filter(f => f[0] >= t0 && f[0] <= t1).map(f => f[1]);
    if (fs.length < 4) return null; const p = pct(fs, 0.9); if (p < -100) return null;
    const r = this.rel(p); return r === null ? null : Math.round(r * 10) / 10;
  }
  start() {
    if (this.on) return; this.on = true; this.uStart = null;
    const r = this.r = new SR(); r.lang = LANG; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    if (this.local) { try { r.processLocally = true; } catch {} }
    if (this.phrases.length && typeof window.SpeechRecognitionPhrase === "function") { try { r.phrases = this.phrases.slice(0, 100).map(x => new window.SpeechRecognitionPhrase(x, 3)); } catch {} }
    r.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i], text = res[0].transcript.trim();
        if (!this.uStart) this.uStart = Date.now();
        this.onActivity && this.onActivity();
        if (res.isFinal) { const end = Date.now(), t0 = this.uStart - 1200; if (text) this.onFinal(text, t0, end, this.score(t0 - 600, end)); this.uStart = null; }
        else interim += text + " ";
      }
      this.onInterim && this.onInterim(interim.trim());
    };
    r.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { this.on = false; this.onState && this.onState("denied"); }
      else if (e.error === "language-not-supported") { this.on = false; this.onState && this.onState("lang"); }
      else if (e.error === "audio-capture") this.trackFail = true;
    };
    r.onend = () => { if (this.on && this.r === r) setTimeout(() => { if (this.on && this.r === r) this.begin(r); }, 250); };
    this.begin(r);
  }
  /* Si el navegador lo permite, el reconocimiento usa el mismo micrófono que el medidor de volumen.
     Así se evita que en algunos móviles los dos compitan por el micrófono. */
  begin(r) {
    try { if (this.track && !this.trackFail && this.track.readyState === "live") r.start(this.track); else r.start(); this.onState && this.onState("on"); }
    catch (e) {
      if (this.track && !this.trackFail) { this.trackFail = true; try { r.start(); this.onState && this.onState("on"); return; } catch {} }
      this.onState && this.onState("error");

  }

}

/* Ajuste del micrófono a la voz de su usuario: mide el ruido de la sala y la voz al leer una frase. */
function calibrateUI(box, m, sentence) {
  return new Promise(resolve => {
    let token = 0; const finish = cal => { token++; resolve(cal); };
    const run = async () => {
      const my = ++token;
      const alive = () => my === token && box.isConnected;
      box.innerHTML = `<div class="card pad calbox"><div class="row" style="justify-content:space-between"><h3>Ajuste del micrófono</h3><button class="btn ghost sm" data-skip type="button">Omitir</button></div>
        <p class="small muted" data-msg>Guarda silencio un momento…</p><div class="say" data-say hidden>${esc(sentence)}</div><div class="calbar"><i data-bar></i></div>
        <p class="small muted">Sirve para distinguir tu voz de la de quienes están cerca. Esta frase no se transcribe.</p></div>`;
      box.querySelector("[data-skip]").onclick = () => finish(null);
      const msg = box.querySelector("[data-msg]"), bar = box.querySelector("[data-bar]"), say = box.querySelector("[data-say]");
      const t0 = Date.now();
      while (Date.now() - t0 < 1800) { if (!alive()) { if (my === token) finish(null); return; } bar.style.width = ((Date.now() - t0) / 18) + "%"; await sleep(100); }
      const noise = pct(m.frames.filter(f => f[0] >= t0).map(f => f[1]), 0.5);
      if (noise === null || noise < -100) { box.innerHTML = `<div class="notice small">No se puede medir el volumen en este dispositivo. Se usará el ajuste automático.</div>`; return finish(null); }
      msg.textContent = "Ahora lee en voz alta, con tu tono normal:"; say.hidden = false; bar.style.width = "0%";
      const t1 = Date.now(); let voiced = [];
      while (Date.now() - t1 < 10000) {
        if (!alive()) { if (my === token) finish(null); return; }
        voiced = m.frames.filter(f => f[0] >= t1 && f[1] > noise + 12).map(f => f[1]);
        bar.style.width = Math.min(100, voiced.length / 40 * 100) + "%"; if (voiced.length >= 40) break; await sleep(100);
      }
      if (voiced.length < 40) {
        box.innerHTML = `<div class="card pad calbox"><p class="small">No te hemos oído con claridad. Acerca el dispositivo o habla un poco más alto.</p><div class="row"><button class="btn sm pri" data-retry type="button">Repetir</button><button class="btn sm" data-skip type="button">Continuar sin ajuste</button></div></div>`;
        box.querySelector("[data-retry]").onclick = run; box.querySelector("[data-skip]").onclick = () => finish(null); return;
      }
      finish({noise, voice: pct(voiced, 0.7)});
    };
    run();
  });
}
function micErrorText(err) {
  const m = String(err && (err.message || err.name) || err);
  if (m === "insecure") return "El micrófono solo funciona en una dirección segura (https).";

  if (/NotFound/i.test(m)) return "No se ha encontrado ningún micrófono en este dispositivo.";

/* -------------------- Lógica de transcripción -------------------- */
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zñ0-9\s]/g," ").split(/\s+/).filter(w => w.length > 2);
function similarity(a, b) { const A = new Set(norm(a)), B = new Set(norm(b)); if (!A.size || !B.size) return 0; let n = 0; A.forEach(w => { if (B.has(w)) n++; }); return 2*n/(A.size+B.size); }

function containment(a, b) { const A = new Set(norm(a)), B = new Set(norm(b)); if (!A.size || !B.size) return 0; let n = 0; A.forEach(w => { if (B.has(w)) n++; }); return n / Math.min(A.size, B.size); }
const ECHO_GAP = 2500, PART_GAP = 4000, DOUBT = -12;
function tidy(t) { t = String(t).replace(/\s+/g, " ").trim(); if (!t) return t; t = t[0].toUpperCase() + t.slice(1); if (!/[.?!…:;]$/.test(t)) t += "."; return t; }
function speechUtts() { return S.utts.filter(u => u.kind === "speech"); }
function rebuild(u) {
  if (!u.edited && !u.polished) u.text = u.parts.map(x => tidy(x.text)).join(" ");
  u.t = Math.min(...u.parts.map(x => x.t)); u.end = Math.max(...u.parts.map(x => x.end));
  u.doubt = u.parts.some(x => x.doubt || x.moved);
}
/* Intensidad con la que el micrófono de una persona captó el sonido en un intervalo. */
function relOf(pid, t0, t1) {
  if (pid === "host") return mic ? mic.score(t0, t1) : null;
  const p = S.people.get(pid); if (!p || !p.lv) return null;
  const v = p.lv.filter(x => x[0] >= t0 && x[0] <= t1 + 400).map(x => x[1]);
  return v.length >= 2 ? pct(v, 0.9) : null;
}
/* Las frases seguidas de la misma persona se unen en una sola intervención. */
function addPart(part, tags = []) {
  const last = S.utts[S.utts.length - 1];
  if (last && last.kind === "speech" && last.pid === part.pid && last.item === S.curItem && !last.edited && !last.polished
      && !(last.tags || []).length && !(tags || []).length && part.t - last.end < PART_GAP) { last.parts.push(part); rebuild(last); return last; }
  const sp = S.people.get(part.pid);
  const u = {id:uid(), kind:"speech", pid:part.pid, name: sp ? sp.name : "Asistente", parts:[part], item:S.curItem, tags:[...(tags || [])]};
  rebuild(u); insertUtt(u); return u;
}
/* Inserta en orden cronológico solo entre intervenciones del mismo punto, sin saltar
   por encima de cambios de punto, votaciones o notas, que marcan la estructura del acta. */
function insertUtt(u) {
  let i = S.utts.length;
  while (i > 0) { const q = S.utts[i - 1]; if (q.kind === "speech" && q.item === u.item && q.t > u.t) i--; else break; }
  S.utts.splice(i, 0, u);
}
function removePart(u, q) {
  u.parts = u.parts.filter(x => x !== q);
  if (!u.parts.length) S.utts = S.utts.filter(x => x !== u); else rebuild(u);
}
function refresh() { renderTranscript(); renderStats(); }

/* Recibe una frase de un micrófono.
   1. Si otro micrófono ya ha captado la misma frase (eco en la sala), se queda la del
      micrófono que la oyó con más intensidad respecto a la voz de su usuario.
   2. Si llega con poca intensidad, se busca qué micrófono oía más fuerte en ese momento.
      Si ninguno destaca, se marca para revisar quién habla. */
function ingest(u) {
  if (!S.rec || S.off) return;
  const p0 = S.people.get(u.pid); if (!p0 || !p0.admitted) return;
  const part = {id:uid(), pid:u.pid, text:String(u.text || "").trim(), t:u.t, end:u.end || u.t + 1500,
    score: typeof u.score === "number" && isFinite(u.score) ? u.score : null};
  if (!part.text) return;
  if (S.meeting.captureMode === "single") { if (S.speaker && S.people.get(S.speaker)) part.pid = S.speaker; addPart(part, u.tags); return refresh(); }
  for (const e of speechUtts().slice(-25)) for (const q of e.parts || []) {
    if (q.pid === part.pid) continue;
    if (Math.max(q.t, part.t) - Math.min(q.end, part.end) > ECHO_GAP) continue;
    if (containment(q.text, part.text) < 0.5) continue;
    S.dupes++;
    if ((part.score ?? -20) > (q.score ?? -20) + 2) { removePart(e, q); part.merged = (q.merged || 0) + 1; addPart(part, u.tags); }
    else q.merged = (q.merged || 0) + 1;
    return refresh();
  }
  if (S.meeting.captureMode === "multi" && part.score !== null && part.score < DOUBT) {
    let best = null, bestS = -Infinity;
    S.people.forEach(p => { if (!p.admitted || p.leftAt || p.pid === part.pid) return; const v = relOf(p.pid, part.t - 500, part.end); if (v !== null && v > bestS) { bestS = v; best = p; } });
    if (best && bestS > -8 && bestS > part.score + 6) { part.from = part.pid; part.pid = best.pid; part.moved = true; part.score = bestS; }
    else part.doubt = true;
  }
  addPart(part, u.tags); refresh();
}

          : `<ul class="vwho">${el2.map(p => `<li class="${v.ballots.has(p.pid) ? "done" : "wait"}">${v.ballots.has(p.pid) ? I.check.replace("<svg",'<svg style="width:14px;height:14px;color:var(--ok)"') : '<span style="width:14px;display:inline-block;text-align:center">·</span>'}${esc(p.name)}</li>`).join("")}</ul><p class="small muted">El sentido de cada voto se muestra al cerrar.</p>`}
        <div><div class="small muted" style="margin-bottom:6px">Tu voto</div><div class="vmini">${["yes","no","abs"].map(k => `<button type="button" class="${k}" data-hv="${k}" aria-pressed="${mine === k}">${CHOICES[k].label}</button>`).join("")}</div></div>
        <button class="btn pri" id="vClose" type="button">Cerrar votación y ver resultado</button>
      </div>`;
    el.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => castVote("host", b.dataset.hv));
    $("#vClose").onclick = closeLiveVote;
    $("#vCancel").onclick = cancelLiveVote;
  } else {
    const f = v.final, tone = resultTone(f.result);
    const last = [...S.utts].reverse().find(u => u.kind === "vote");
    el.innerHTML = `<div class="sec-h"><h3>Resultado de la votación</h3><button class="btn ghost sm" id="vDismiss" type="button" aria-label="Cerrar">✕</button></div>
      <div class="vp-b">
        <p class="vp-s">${esc(v.subject)}</p>
        <div class="vres"><div class="vres-h ${tone}">${tone === "ok" ? I.check.replace("<svg",'<svg style="width:24px;height:24px"') : tone === "ko" ? I.cross.replace("<svg",'<svg style="width:24px;height:24px"') : ""}${esc(f.result)}</div>${resultBarsHTML(f)}<span class="small muted mono">Votaron ${f.cast} de ${f.eligible}${v.secret ? " · votación secreta" : ""}</span></div>
        ${last ? voterDetailHTML(last.vote) : ""}
        <p class="small" style="color:var(--ok)">Registrada en la transcripción y en Acuerdos.</p>
        <button class="btn" id="vDone" type="button">Cerrar</button>
      </div>`;
    $("#vDismiss").onclick = dismissVote; $("#vDone").onclick = dismissVote;
  }
}
function giveFloor(pid) {
  const p = S.people.get(pid); if (!p) return; p.hand = false;
  if (S.meeting.captureMode === "single") S.speaker = pid;
  if (p.conn) try { p.conn.send({t:"floor"}); } catch {}
  renderHands(); renderSpeakerBar(); toast(`${p.name} tiene la palabra`);
}

function admit(pid, yes) {
  const p = S.people.get(pid); if (!p) return;
  if (yes) { p.admitted = true; p.color = colorFor([...S.people.values()].filter(x => x.admitted).length); if (S.startedAt) sysLine(`Se incorpora ${p.name}.`); }
  else { try { p.conn && p.conn.send({t:"rejected"}); } catch {} S.people.delete(pid); }
  broadcast(); renderPeople(); renderSpeakerBar(); renderTranscript();
}

/* Micrófono del propio anfitrión */
function hostShouldListen() { return S.rec && !S.off && S.meeting.myMic && (S.meeting.captureMode !== "ptt" || S.hostTalking); }
function vocabList() {
  const names = [...S.people.values()].filter(p => p.admitted).map(p => p.name);
  const g = String(S.meeting.glossary || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
  return [...new Set([...names, ...g])].slice(0, 80);
}
function calibrateModal(m, name) {
  return new Promise(resolve => {
    const md = modal("Ajuste de tu micrófono", `<div id="hcal"></div>`, []);
    const f = md.querySelector(".mf"); if (f) f.remove();
    let settled = false; const done = cal => { if (settled) return; settled = true; clearInterval(iv); md.remove(); resolve(cal); };
    const iv = setInterval(() => { if (!md.isConnected) done(null); }, 300);   // si se cierra la ventana, se continúa sin ajuste
    calibrateUI($("#hcal", md), m, `Soy ${name} y levanto acta de esta reunión del Centro Universitario.`).then(done);
  });
}
async function startHostMic() {
  const me = S.people.get("host");
  try {
    if (!mic) {
      const sup = await speechSupport();
      if (sup.local === "downloadable" && typeof SR.install === "function") { try { await SR.install({langs:[LANG], processLocally:true}); sup.local = await SR.available({langs:[LANG], processLocally:true}); } catch {} }
      if (S.meeting.strict && sup.local !== "available") { toast("Modo estricto: este dispositivo no puede transcribir en local. Tu voz no se transcribirá.", 5000); return; }
      me.local = sup.local;
      mic = new Mic({ local: sup.local === "available",
        onFinal: (text, t, end, score) => ingest({pid:"host", text, t, end, score}),
        onInterim: txt => { const el = $("#interim"); if (el) el.textContent = txt ? `${me.name}: ${txt}…` : ""; },
        onLevel: l => { me.level = l; },
        onState: s => { me.mic = s; renderPeople(); if (s === "denied") toast(micErrorText("NotAllowed"), 5000); } });
      await mic.open();
    }
    if (S.hostCal === undefined) { S.hostCal = await calibrateModal(mic, me.name); mic.cal = S.hostCal; me.cal = !!S.hostCal; renderPeople(); }
    mic.phrases = vocabList();
    if (hostShouldListen()) mic.start();
  } catch (e) { if (mic) { try { mic.close(); } catch {} } mic = null; toast(micErrorText(e), 6000); }
}
function toggleHostTalk() {
  if (!S.rec || S.off) { toast("Inicia la transcripción para poder hablar"); return; }
  S.hostTalking = !S.hostTalking;
  const me = S.people.get("host"); if (me) me.talking = S.hostTalking;
  const b = $("#talkBtn"); b.className = "btn" + (S.hostTalking ? " rec" : ""); b.lastChild.textContent = S.hostTalking ? " Terminar" : " Hablar";
  if (S.hostTalking) startHostMic(); else if (mic) mic.stop();
  renderPeople();
}
setInterval(() => { if ($("#plist")) renderPeopleLight(); }, 200);

/* -------------------- Red P2P (anfitrión) -------------------- */
function startHostNetwork() {
  const ns = $("#netState");
  if (typeof Peer === "undefined") { ns.textContent = "Sin conexión entre dispositivos. Usa el modo de un solo dispositivo."; return; }
  try {
    peer = new Peer(PEER_PREFIX + S.code.toLowerCase(), {debug:0});
    ns.textContent = "Conectando…";
    peer.on("open", () => { ns.innerHTML = `<span style="color:var(--ok)">● Sala abierta</span>`; });
    peer.on("error", e => {
      if (e.type === "unavailable-id") { S.code = newCode(); try { peer.destroy(); } catch {} $("#code").textContent = S.code; $("#qr").innerHTML = qrSVG(joinURL()); startHostNetwork(); return; }
      ns.textContent = IN_CLAUDE ? "La vista previa no puede conectar dispositivos." : "No se pudo abrir la sala en red. Puedes seguir con este dispositivo.";
    });
    peer.on("connection", conn => {
      conn.on("data", d => onHostData(conn, d));
      conn.on("close", () => { const p = [...S.people.values()].find(x => x.conn === conn); if (p) { p.leftAt = Date.now(); p.mic = "off"; p.hand = false; if (S.startedAt && p.admitted) sysLine(`${p.name} abandona la sesión.`); renderPeople(); renderHands(); renderTranscript(); } });
    });
  } catch { ns.textContent = "No se pudo abrir la sala en red."; }
}
function onHostData(conn, d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "hello") {
    const name = String(d.name || "").slice(0, 80).trim(); if (!name) return;
    const pid = conn.peer;
    const prev = S.people.get(pid);
    const p = prev || {pid, name, role:String(d.role||"").slice(0,60), admitted: !S.meeting.admit, local: d.local, mic:"off", joinedAt:Date.now(), consentAt:d.consentAt || Date.now(), color:colorFor(S.people.size)};
    p.conn = conn; p.leftAt = null; S.people.set(pid, p);
    if (p.admitted && S.startedAt && !prev) sysLine(`Se incorpora ${p.name}.`);
    if (!p.admitted) toast(`${p.name} espera para entrar`);
    sendState(p); renderPeople(); renderTranscript(); return;
  }
  const p = S.people.get(conn.peer); if (!p) return;
  if (d.t === "utt") {
    const text = String(d.text||"").slice(0, 4000).trim(); if (!text) return;
    /* La hora se calcula con el reloj de la secretaría: el móvil solo informa de cuánto duró
       la frase y de hace cuánto terminó, así un reloj desajustado no desordena el acta. */
    const dur = Math.max(0, Math.min(120000, +d.dur || 0)), ago = Math.max(0, Math.min(600000, +d.ago || 0));
    const end = Date.now() - ago;
    ingest({pid:p.pid, text, t:end - dur, end, score: typeof d.score === "number" ? d.score : null});
  }
  else if (d.t === "level") {
    p.level = Math.max(0, Math.min(1, +d.v || 0));
    if (typeof d.s === "number" && isFinite(d.s)) { const now = Date.now(); (p.lv = p.lv || []).push([now, d.s]); while (p.lv.length && p.lv[0][0] < now - 40000) p.lv.shift(); }
  }
  else if (d.t === "talk") { p.talking = !!d.v; renderPeople(); }
  else if (d.t === "cal") { p.cal = !!d.ok; renderPeople(); }
  else if (d.t === "mic") { p.mic = String(d.v); p.local = d.local || p.local; renderPeople(); }
  else if (d.t === "ballot") { if (S.vote && S.vote.open && d.id === S.vote.id) castVote(p.pid, String(d.c)); }
  else if (d.t === "hand") { p.hand = !!d.v; p.handAt = Date.now(); renderHands(); if (p.hand) toast(`${p.name} pide la palabra`); }
}
function stateFor(p) { return {t:"state", admitted:!!p.admitted, rec:S.rec, off:S.off, strict:S.meeting.strict, item:S.curItem, itemTitle:S.meeting.items[S.curItem], body:S.meeting.body, title:S.meeting.title, mode:S.meeting.captureMode, vocab:vocabList(), vote:voteFor(p)}; }
function voteFor(p) {
  const v = S.vote; if (!v || !p.admitted) return null;
  const elig = eligibleVoters();
  return {id:v.id, subject:v.subject, secret:v.secret, open:v.open, item:v.item+1,
    cast: v.open ? [...v.ballots.keys()].filter(pid => elig.some(x => x.pid === pid)).length : v.final.cast,
    eligible: v.open ? elig.length : v.final.eligible,
    mine: v.open ? (v.ballots.get(p.pid) || null) : null,
    final: v.open ? null : v.final};
}
function sendState(p) { if (p.conn && p.conn.open) try { p.conn.send(stateFor(p)); } catch {} }
function broadcast() { S.people.forEach(p => sendState(p)); }

/* -------------------- Vista: unirse -------------------- */
function viewJoin(prefill) {
  const code = (prefill || "").toUpperCase();
  $("#app").innerHTML = `
  <section class="pp gut">
    <button class="btn ghost sm" id="back" type="button">← Volver</button>
    <h1 style="margin:10px 0 6px;font-size:30px">Unirme a la reunión</h1>
    <p class="muted" style="margin-bottom:20px">Tu voz se convertirá en texto en este dispositivo y solo se enviará el texto a quien levanta acta.</p>
    <form id="jf" class="card pad stack" novalidate>
      <label class="f">Código de la reunión<input type="text" id="jCode" value="${esc(code)}" maxlength="6" autocomplete="off" autocapitalize="characters" style="font-family:var(--f-mono);letter-spacing:.2em;font-size:20px;text-transform:uppercase" placeholder="ABC123"></label>
      <label class="f">Nombre y apellidos<input type="text" id="jName" autocomplete="name" placeholder="Como quieras que aparezca en el acta"></label>
      <label class="f">Cargo o representación (opcional)<input type="text" id="jRole" placeholder="Profesora de Didáctica de la Lengua"></label>
      <div id="jSup"></div>
      <div class="notice info stack" style="gap:10px">
        <label class="check"><input type="checkbox" id="c1"><span>Sé que mis intervenciones se transcribirán con mi nombre y que la transcripción servirá para redactar el acta de esta sesión.</span></label>
        <label class="check"><input type="checkbox" id="c2"><span>Sé que ni el audio ni el texto se almacenan en la aplicación, y que puedo salir en cualquier momento.</span></label>
      </div>
      <button class="btn pri lg" type="submit">${I.mic} Activar micrófono y entrar</button>
      <button class="btn ghost sm" type="button" id="jPriv">Cómo se protege mi privacidad</button>
    </form>
  </section>`;
  $("#back").onclick = () => go("home");
  $("#jPriv").onclick = showPrivacy;
  speechSupport().then(s => { $("#jSup").innerHTML = privBadge(s.ok ? s.local : "none"); });
  $("#jf").onsubmit = async e => {

    });
  } else {
    mdToParas(body).forEach(p => kids.push(p(D)));
  }
  kids.push(new Paragraph({spacing:{before:400}, children:[new TextRun({text:"Documento generado con Actas CUSAFA. La aplicación no conserva copia de su contenido. " + (kind === "acta" ? "Borrador redactado con asistencia de IA: debe revisarlo la secretaría y aprobarlo el órgano." : "Transcripción automática: revise posibles errores de reconocimiento."), italics:true, size:16, color:"7A8C99", font:"Calibri"})]}));
  const doc = new Document({creator: anon ? "Actas CUSAFA" : (M.secretary || M.me || "Actas CUSAFA"), title:`${M.body} · ${M.title}`,
    sections:[{properties:{page:{margin:{top:1100, bottom:1100, left:1300, right:1300}}},
      footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({children:["Página ", PageNumber.CURRENT, " de ", PageNumber.TOTAL_PAGES], size:16, color:"7A8C99", font:"Calibri"})]})]})},
      children:kids}]});
  const blob = await Packer.toBlob(doc);
  const slug = (M.body + "-" + (M.date || "")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
  await saveFile(`${kind === "acta" ? "Acta" : "Transcripcion"}${anon ? "-anonima" : ""}-${slug}.docx`, blob);
}
function mdToParas(md) {
  const lines = String(md).replace(/\r/g,"").split("\n"); const out = [];
  const runs = (D, t, base = {}) => { const parts = t.split(/(\*\*[^*]+\*\*)/g).filter(Boolean); return parts.map(s => s.startsWith("**") ? new D.TextRun({text:s.slice(2,-2), bold:true, size:22, font:"Cambria", ...base}) : new D.TextRun({text:s, size:22, font:"Cambria", ...base})); };
  lines.forEach(l => {
    const t = l.trim();
    if (!t) return;
    if (/^#{1,2}\s/.test(t)) out.push(D => new D.Paragraph({spacing:{before:280, after:120}, children:[new D.TextRun({text:t.replace(/^#+\s*/,"").replace(/\*\*/g,""), bold:true, color:"006A9D", size:24, font:"Calibri"})]}));
    else if (/^#{3,}\s/.test(t)) out.push(D => new D.Paragraph({spacing:{before:200, after:80}, children:[new D.TextRun({text:t.replace(/^#+\s*/,"").replace(/\*\*/g,""), bold:true, size:22, font:"Calibri"})]}));
    else if (/^[-*•]\s/.test(t)) out.push(D => new D.Paragraph({bullet:{level:0}, spacing:{after:80, line:290}, children:runs(D, t.replace(/^[-*•]\s*/,""))}));
    else if (/^---+$/.test(t)) return;
    else out.push(D => new D.Paragraph({spacing:{after:140, line:300}, alignment:D.AlignmentType.JUSTIFIED, children:runs(D, t)}));
  });
  return out;
}

async function callAI(prompt, {onText, tier = "default", maxTokens = 8000} = {}) {
  if (IN_CLAUDE) {
    const sample = await window.claude.use("sample");
    if (!sample) throw {code:"not_granted"};
    const r = await sample(prompt, {modelTier:tier, cache:false, onText});
    return r.text;
  }
  if (!S.apiKey) throw {code:"nokey"};
  const res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{"content-type":"application/json", "x-api-key":S.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model:S.aiModel || "claude-sonnet-5-5", max_tokens:maxTokens, messages:[{role:"user", content:prompt}]})});
  if (!res.ok) throw {code: res.status === 401 ? "badkey" : res.status === 429 ? "rate_limited" : "http", message:`La IA ha respondido con un error (${res.status}).`};
  const j = await res.json(); const text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
  if (onText) onText({text});
  return text;
}
function aiErrorText(e) {
  const c = e && e.code;
  if (c === "nokey") return "Añade una clave de API de Anthropic en «Pulir con IA» o en la pestaña Acta con IA.";
  if (c === "badkey") return "La clave de API no es válida.";
  if (c === "not_granted") return "No se ha concedido permiso para usar la IA en esta página.";
  if (c === "rate_limited") return "Demasiadas peticiones seguidas. Espera un minuto.";
  return (e && e.message) || "No se ha podido completar la petición a la IA.";
}
async function runAI() {
  const A = S.ai;
  if (!S.utts.some(u => u.kind === "speech" || u.kind === "note")) { toast("Aún no hay intervenciones para redactar el acta"); return; }
  if (!IN_CLAUDE && !S.apiKey) { toast("Añade una clave de API o usa «Copiar texto con instrucciones para otra IA» en Exportar.", 5000); return; }
  const prompt = buildPrompt(A.mode);
  A.busy = true; A.text = ""; renderAI();
  try {
    A.text = await callAI(prompt, {tier:"complex", onText: ({text}) => { A.text = text; const o = $("#aiOut"); if (o) o.textContent = text; }});
  } catch (e) { toast(aiErrorText(e), 5000); }
  A.busy = false; renderAI();
}

async function polishRun(force) {
  const P = S.polish; if (P.busy) return;
  const targets = speechUtts().filter(u => !u.polished && !u.edited && u.text && (force || !S.rec || Date.now() - u.end > 8000));
  if (!targets.length) { if (force) toast("No hay intervenciones nuevas que pulir"); return; }
  P.busy = true; renderPolishState(); let done = 0, changed = 0, skipped = 0;
  try {
    for (let i = 0; i < targets.length; i += 15) {
      const batch = targets.slice(i, i + 15), snap = new Map(batch.map(u => [u.id, u.text]));
      P.progress = `${Math.min(i + 15, targets.length)}/${targets.length}`; renderPolishState();
      let arr;
      try { arr = parseJSONArray(await callAI(polishPrompt(batch, P.level), {tier:"default"})); }
      catch (e) { if (["nokey","badkey","not_granted","rate_limited"].includes(e && e.code)) throw e; skipped += batch.length; continue; }
      if (!Array.isArray(arr)) { skipped += batch.length; continue; }
      for (const r of arr) {
        const u = batch.find(x => x.id === (r && r.id)); if (!u || typeof r.texto !== "string") continue;
        const o = snap.get(u.id), nt = r.texto.replace(/\s+/g, " ").trim();
        if (u.text !== o || u.polished || u.edited || !nt) continue;
        const ratio = nt.length / o.length;

        u.polished = true; done++;
        if (nt !== o) { u.orig = o; u.text = nt; changed++; }
      }
      renderTranscript();
    }
    if (force || changed) toast(`Pulidas ${done} ${done === 1 ? "intervención" : "intervenciones"}${skipped ? `. ${skipped} se han dejado como estaban` : ""}.`, 4000);
  } catch (e) { toast(aiErrorText(e), 5000); if (e && ["nokey","badkey","not_granted"].includes(e.code)) P.auto = false; }
  P.busy = false; P.progress = ""; renderPolishState(); renderTranscript(); renderTabs();
}

  DEMO_PEOPLE.forEach((p,i) => S.people.set(p.pid, {...p, admitted:i < 3, local:"demo", mic:"off", joinedAt:Date.now(), consentAt:Date.now(), color:colorFor(i+1), level:0}));
  demoIdx = 0;
  go("host");
  toast("Admite a Tomás Herrera y pulsa Iniciar transcripción", 4200);
}
function demoResume() {
  S.people.forEach(p => { if (p.admitted && p.pid !== "host") p.mic = "on"; }); renderPeople();
  clearInterval(demoTimer); demoTimer = setInterval(demoStep, 2300); demoStep();
}
function demoPause() { clearInterval(demoTimer); demoTimer = null; S.people.forEach(p => { if (p.pid !== "host") { p.mic = "off"; p.level = 0; } }); renderPeople(); }
function demoBallots() {
  const plan = {d1:"yes", d2:"yes", d3:"yes", d4:"abs"};
  const vid = S.vote && S.vote.id;
  Object.keys(plan).forEach((pid, i) => setTimeout(() => { if (S.role === "demo" && S.vote && S.vote.id === vid && S.vote.open) castVote(pid, plan[pid]); }, 900 + i * 850));
}
function demoStop() { clearInterval(demoTimer); demoTimer = null; }
function demoStep() {
  if (!S || S.role !== "demo" || !S.rec || S.off) return;
  if (S.vote && S.vote.open) return;
  if (demoIdx >= DEMO_SCRIPT.length) { demoPause(); toast("Fin de la demostración. Prueba las pestañas Acta con IA y Exportar.", 5000); return; }
  const st = DEMO_SCRIPT[demoIdx++];
  S.people.forEach(p => p.level = 0);
  if (st[0] === "sys:item") { setItem(st[1]); return demoStep(); }
  if (st[0] === "hand") { const p = S.people.get(st[1]); p.hand = true; p.handAt = Date.now(); renderHands(); return; }
  if (st[0] === "livevote") { openLiveVote(st[1], false); toast("Votación abierta. Vota desde el panel y ciérrala cuando quieras.", 4500); return; }
  if (st[0] === "vote") { S.utts.push({id:uid(), kind:"vote", pid:"host", name:"Votación", text:st[1], vote:{subject:st[1], yes:st[2], no:st[3], abs:st[4], result:st[5]}, t:Date.now(), item:S.curItem, tags:[]}); renderTranscript(); renderTabs(); return; }
  if (st[0] === "dup") { ingest({pid:st[1], text:st[2], t:Date.now()-3500, end:Date.now()-1200, score:-15}); return; }
  const p = S.people.get(st[0]);
  if (!p.admitted) { if (st[0] === "d4") { admit("d4", true); p.mic = "on"; } }
  p.level = 0.55 + Math.random()*0.3;
  ingest({pid:st[0], text:st[1], t:Date.now()-1800, end:Date.now(), score:-1, tags:st[2] ? [...st[2]] : []});
}

/* -------------------- Arranque -------------------- */
(function boot() {
  let code = null; try { code = new URLSearchParams(location.search).get("s"); } catch {}
  if (code && /^[A-Za-z0-9]{6}$/.test(code)) go("join", code); else go("home");
})();
</script>
